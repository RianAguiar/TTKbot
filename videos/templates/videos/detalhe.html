{% extends "base.html" %}

{% block title %}{{ video.titulo }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <a href="{% url 'lista_videos' %}" class="btn btn-link text-decoration-none px-0 mb-3">
                &larr; Voltar para a lista
            </a>

            <div class="ratio ratio-16x9 mb-4 bg-black rounded overflow-hidden">
                <video controls>
                    <source src="{{ video.arquivo.url }}">
                    Seu navegador não suporta a exibição de vídeos.
                </video>
            </div>

            <h1 class="h3 mb-2">{{ video.titulo }}</h1>

            <p class="text-muted small mb-3">
                Publicado em {{ video.criado_em|date:"d/m/Y \à\s H:i" }}
            </p>

            {% if video.descricao %}
                <p class="mb-4" style="white-space: pre-line;">{{ video.descricao }}</p>
            {% endif %}

            <div class="d-flex gap-2">
                <a href="{% url 'lista_videos' %}" class="btn btn-outline-secondary">
                    Voltar
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
